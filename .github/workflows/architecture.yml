name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  arch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test archcheck rules
        run: python -m unittest discover -s tools/archcheck -p "test_*.py" -v
      - name: Test workflow hooks and progress parser
        run: python -m unittest discover -s tools/workflow -p "test_*.py" -v
      - name: Check architecture invariants
        run: python tools/archcheck/archcheck.py
